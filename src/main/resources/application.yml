spring:
  application:
    name: finexs-voyages-backend

  datasource:
    url: jdbc:postgresql://localhost:5432/finexs_voyages
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        use_sql_comments: true
    show-sql: false

  sql:
    init:
      mode: always
      continue-on-error: true

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

server:
  port: 8080
  servlet:
    context-path: /api

app:
  jwt:
    secret: ${JWT_SECRET:finexs-voyages-secret-key-change-in-production-please-this-is-very-important}
    expiration: 86400000

logging:
  level:
    root: INFO
    com.finexs: DEBUG
    org.springframework.security: DEBUG
